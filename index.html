<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七页奶茶社 · 商店后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #333; }
  .hidden { display: none !important; }

  /* 登录 */
  #login-page { max-width: 360px; margin: 120px auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  #login-page h1 { font-size: 20px; text-align: center; margin-bottom: 8px; }
  #login-page p { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  #login-page input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; }
  #login-page input:focus { border-color: #ff8a00; }
  .btn { display: inline-block; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; background: #eee; }
  .btn-primary { background: #ff8a00; color: #fff; }
  .btn-primary:hover { background: #f07d00; }
  .btn-sm { padding: 5px 12px; font-size: 13px; border-radius: 6px; }
  .btn-danger { background: #fee; color: #e5484d; }
  .btn-block { width: 100%; padding: 12px; font-size: 15px; }

  /* 主框架 */
  #admin-page { display: flex; min-height: 100vh; }
  #sidebar { width: 200px; background: #2b2f36; color: #ccc; padding-top: 20px; flex-shrink: 0; }
  #sidebar .logo { color: #fff; font-weight: bold; text-align: center; padding: 0 16px 20px; font-size: 16px; border-bottom: 1px solid #3a3f47; margin-bottom: 8px; }
  #sidebar .nav-item { padding: 13px 24px; cursor: pointer; font-size: 14px; }
  #sidebar .nav-item:hover { background: #343941; }
  #sidebar .nav-item.active { background: #ff8a00; color: #fff; }
  #sidebar .logout { margin-top: 40px; color: #888; font-size: 13px; }
  #main { flex: 1; padding: 24px; overflow: auto; }

  .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 160px; background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .stat-card .label { color: #999; font-size: 13px; margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: bold; color: #ff8a00; }

  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .panel h2 { font-size: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar select, .toolbar input { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  th { color: #999; font-weight: normal; background: #fafafa; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
  .st-wait { background: #fff4e5; color: #ff8a00; }
  .st-making { background: #e8f1ff; color: #2f6fed; }
  .st-done { background: #e9f9ee; color: #2e9e5b; }
  .st-cancel { background: #f2f2f2; color: #999; }
  .tag-badge { display: inline-block; background: #fff4e5; color: #ff8a00; border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-left: 6px; }
  .items-cell { color: #666; line-height: 1.7; }
  .empty { text-align: center; color: #bbb; padding: 40px 0; }

  /* 弹窗 */
  #modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal { background: #fff; border-radius: 12px; padding: 24px; width: 420px; max-width: 92vw; max-height: 88vh; overflow: auto; }
  #modal h3 { font-size: 16px; margin-bottom: 16px; }
  .form-item { margin-bottom: 12px; }
  .form-item label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .form-item input, .form-item textarea, .form-item select { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
  .form-item input:focus, .form-item textarea:focus { border-color: #ff8a00; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 22px; border-radius: 30px; font-size: 14px; z-index: 99; display: none; }
  .search-input { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 180px; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page">
  <h1>🧋 七页奶茶社</h1>
  <p>商店管理后台</p>
  <input id="login-password" type="password" placeholder="请输入管理密码" autocomplete="current-password">
  <button class="btn btn-primary btn-block" onclick="login()">登 录</button>
</div>

<!-- 管理主页 -->
<div id="admin-page" class="hidden">
  <div id="sidebar">
    <div class="logo">🧋 七页奶茶社</div>
    <div class="nav-item active" data-tab="orders" onclick="switchTab('orders')">📋 订单管理</div>
    <div class="nav-item" data-tab="products" onclick="switchTab('products')">🧋 商品管理</div>
    <div class="nav-item" data-tab="categories" onclick="switchTab('categories')">🏷️ 分类管理</div>
    <div class="nav-item" data-tab="specs" onclick="switchTab('specs')">⚙️ 规格设置</div>
    <div class="nav-item logout" onclick="logout()">退出登录</div>
  </div>
  <div id="main">
    <div class="stats" id="stats"></div>

    <!-- 订单管理 -->
    <div class="panel" id="tab-orders">
      <h2>
        订单管理
        <span class="toolbar">
          <select id="order-status-filter" onchange="loadOrders()">
            <option value="">全部状态</option>
            <option>待支付</option>
            <option>已支付·制作中</option>
            <option>制作完成</option>
            <option>已完成</option>
            <option>已取消</option>
          </select>
          <input class="search-input" id="order-search" placeholder="搜索订单号/备注码" oninput="renderOrders()">
          <button class="btn btn-sm" onclick="loadOrders()">刷新</button>
        </span>
      </h2>
      <table>
        <thead><tr><th>订单号</th><th>时间</th><th>方式</th><th>商品</th><th>备注码</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>

    <!-- 商品管理 -->
    <div class="panel hidden" id="tab-products">
      <h2>商品管理 <button class="btn btn-primary btn-sm" onclick="editProduct()">＋ 新增商品</button></h2>
      <table>
        <thead><tr><th>商品</th><th>分类</th><th>价格</th><th>标签</th><th>排序</th><th>上架</th><th>操作</th></tr></thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>

    <!-- 分类管理 -->
    <div class="panel hidden" id="tab-categories">
      <h2>分类管理 <button class="btn btn-primary btn-sm" onclick="editCategory()">＋ 新增分类</button></h2>
      <table>
        <thead><tr><th>ID</th><th>名称</th><th>排序</th><th>启用</th><th>操作</th></tr></thead>
        <tbody id="categories-tbody"></tbody>
      </table>
    </div>

    <!-- 规格设置 -->
    <div class="panel hidden" id="tab-specs">
      <h2>规格设置 <span style="font-size:12px;color:#999;font-weight:normal">杯型/小料含加价（元），用逗号分隔，格式：名称:加价</span></h2>
      <div class="form-item"><label>杯型（如：中杯:0, 大杯:3）</label><textarea id="spec-cup" rows="2"></textarea></div>
      <div class="form-item"><label>甜度（逗号分隔，如：无糖, 三分糖）</label><textarea id="spec-sugar" rows="2"></textarea></div>
      <div class="form-item"><label>冰量（逗号分隔）</label><textarea id="spec-ice" rows="2"></textarea></div>
      <div class="form-item"><label>小料（如：珍珠:2, 椰果:2）</label><textarea id="spec-toppings" rows="2"></textarea></div>
      <button class="btn btn-primary" onclick="saveSpecs()">保存规格</button>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
<div id="modal-mask" class="hidden">
  <div id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem('admin_token') || '';
let orders = [], products = [], categories = [];

// ---------- 工具 ----------
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}
async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('登录已失效'); }
  if (data.code !== 0) { toast(data.message || '操作失败'); throw new Error(data.message); }
  return data.data;
}
function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtMoney(n) { return '¥' + (Number(n) || 0).toFixed(2); }
function statusClass(s) {
  if (s === '待支付') return 'st-wait';
  if (s === '已支付·制作中') return 'st-making';
  if (s === '制作完成' || s === '已完成') return 'st-done';
  return 'st-cancel';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 登录 ----------
async function login() {
  const password = document.getElementById('login-password').value;
  if (!password) return toast('请输入密码');
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  const data = await res.json();
  if (data.code !== 0) return toast(data.message || '密码错误');
  token = data.data.token;
  localStorage.setItem('admin_token', token);
  enterAdmin();
}
function logout() {
  token = '';
  localStorage.removeItem('admin_token');
  document.getElementById('admin-page').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
}
function enterAdmin() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('admin-page').classList.remove('hidden');
  loadStats(); loadOrders(); loadProducts(); loadCategories(); loadSpecs();
}

// ---------- 概况 ----------
async function loadStats() {
  try {
    const s = await api('/api/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="label">今日订单</div><div class="value">${s.todayOrders}</div></div>
      <div class="stat-card"><div class="label">今日营收</div><div class="value">${fmtMoney(s.todayRevenue)}</div></div>
      <div class="stat-card"><div class="label">待支付</div><div class="value">${s.pendingOrders}</div></div>
      <div class="stat-card"><div class="label">制作中</div><div class="value">${s.makingOrders}</div></div>`;
  } catch (e) {}
}

// ---------- 订单 ----------
async function loadOrders() {
  const status = document.getElementById('order-status-filter').value;
  orders = await api('/api/admin/orders' + (status ? '?status=' + encodeURIComponent(status) : ''));
  renderOrders();
  loadStats();
}
function renderOrders() {
  const kw = (document.getElementById('order-search').value || '').trim().toLowerCase();
  const list = kw ? orders.filter(o =>
    (o.id || '').toLowerCase().includes(kw) || (o.remarkCode || '').includes(kw)) : orders;
  const tbody = document.getElementById('orders-tbody');
  if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无订单</td></tr>'; return; }
  tbody.innerHTML = list.map(o => `
    <tr>
      <td>${esc(o.id)}</td>
      <td>${fmtTime(o.createdAt)}</td>
      <td>${o.mode === 'delivery' ? '外送<br><small style="color:#999">${esc(o.address)}</small>' : o.mode === 'custom' ? '自定义' : '自取'}</td>
      <td class="items-cell">${(o.items || []).map(i => esc(i.emoji || '') + ' ' + esc(i.name) + '<br><small>' + esc(i.spec) + ' × ' + i.qty + '</small>').join('<br>') || '—'}${o.note ? '<br><small style="color:#ff8a00">备注：' + esc(o.note) + '</small>' : ''}</td>
      <td><b>${esc(o.remarkCode)}</b></td>
      <td>${fmtMoney(o.total)}</td>
      <td><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></td>
      <td>${orderActions(o)}</td>
    </tr>`).join('');
}
function orderActions(o) {
  const btn = (label, status) => `<button class="btn btn-sm" onclick="setOrderStatus('${o.id}','${status}')">${label}</button>`;
  let html = '';
  if (o.status === '待支付') html += btn('确认收款', '已支付·制作中') + ' ' + btn('取消', '已取消');
  else if (o.status === '已支付·制作中') html += btn('制作完成', '制作完成') + ' ' + btn('取消', '已取消');
  else if (o.status === '制作完成') html += btn('完成', '已完成');
  else if (o.status === '已完成' || o.status === '已取消') html += '<span style="color:#ccc">—</span>';
  return html;
}
async function setOrderStatus(id, status) {
  await api('/api/admin/orders/' + id, 'PATCH', { status });
  toast('已更新为：' + status);
  loadOrders();
}

// ---------- 商品 ----------
async function loadProducts() {
  products = await api('/api/admin/products');
  renderProducts();
}
function renderProducts() {
  const tbody = document.getElementById('products-tbody');
  if (products.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无商品</td></tr>'; return; }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>${esc(p.emoji)} ${esc(p.name)}<br><small style="color:#999">${esc(p.desc)}</small></td>
      <td>${esc(catName(p.categoryId))}</td>
      <td>${fmtMoney(p.price)}</td>
      <td>${p.tag ? '<span class="tag-badge">' + esc(p.tag) + '</span>' : '—'}</td>
      <td>${p.sort}</td>
      <td>${p.enabled ? '✅' : '❌'}</td>
      <td>
        <button class="btn btn-sm" onclick="editProduct(${p.id})">编辑</button>
        <button class="btn btn-sm" onclick="toggleProduct(${p.id}, ${!p.enabled})">${p.enabled ? '下架' : '上架'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">删除</button>
      </td>
    </tr>`).join('');
}
function catName(id) {
  const c = categories.find(c => c.id === id);
  return c ? c.name : id;
}
async function toggleProduct(id, enabled) {
  await api('/api/admin/products/' + id, 'PUT', { enabled });
  loadProducts();
}
async function deleteProduct(id) {
  if (!confirm('确定删除该商品？')) return;
  await api('/api/admin/products/' + id, 'DELETE');
  toast('已删除');
  loadProducts();
}
function editProduct(id) {
  const p = id ? products.find(x => x.id === id) : {};
  openModal(`<h3>${id ? '编辑商品' : '新增商品'}</h3>
    <div class="form-item"><label>商品名称 *</label><input id="f-name" value="${esc(p.name || '')}"></div>
    <div class="form-item"><label>分类</label><select id="f-cat">${categories.map(c => `<option value="${esc(c.id)}" ${p.categoryId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="form-item"><label>价格（元）*</label><input id="f-price" type="number" step="0.01" value="${p.price != null ? p.price : ''}"></div>
    <div class="form-item"><label>Emoji 图标</label><input id="f-emoji" value="${esc(p.emoji || '🧋')}"></div>
    <div class="form-item"><label>描述</label><textarea id="f-desc" rows="2">${esc(p.desc || '')}</textarea></div>
    <div class="form-item"><label>标签（如：新品/招牌）</label><input id="f-tag" value="${esc(p.tag || '')}"></div>
    <div class="form-item"><label>排序（越小越靠前）</label><input id="f-sort" type="number" value="${p.sort != null ? p.sort : 0}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProduct(${id || 0})">保存</button>
    </div>`);
}
async function saveProduct(id) {
  const body = {
    name: document.getElementById('f-name').value.trim(),
    categoryId: document.getElementById('f-cat').value,
    price: document.getElementById('f-price').value,
    emoji: document.getElementById('f-emoji').value.trim() || '🧋',
    desc: document.getElementById('f-desc').value.trim(),
    tag: document.getElementById('f-tag').value.trim(),
    sort: document.getElementById('f-sort').value,
  };
  if (!body.name || body.price === '') return toast('请填写名称和价格');
  if (id) await api('/api/admin/products/' + id, 'PUT', body);
  else await api('/api/admin/products', 'POST', body);
  closeModal(); toast('已保存'); loadProducts();
}

// ---------- 分类 ----------
async function loadCategories() {
  categories = await api('/api/admin/categories');
  renderCategories();
}
function renderCategories() {
  const tbody = document.getElementById('categories-tbody');
  if (categories.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无分类</td></tr>'; return; }
  tbody.innerHTML = categories.map(c => `
    <tr>
      <td>${esc(c.id)}</td>
      <td>${esc(c.name)}</td>
      <td>${c.sort}</td>
      <td>${c.enabled ? '✅' : '❌'}</td>
      <td>
        <button class="btn btn-sm" onclick="editCategory('${esc(c.id)}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteCategory('${esc(c.id)}')">删除</button>
      </td>
    </tr>`).join('');
  renderProducts();
}
async function deleteCategory(id) {
  if (!confirm('确定删除该分类？')) return;
  await api('/api/admin/categories/' + id, 'DELETE');
  toast('已删除');
  loadCategories();
}
function editCategory(id) {
  const c = id ? categories.find(x => x.id === id) : {};
  openModal(`<h3>${id ? '编辑分类' : '新增分类'}</h3>
    <div class="form-item"><label>分类ID *（英文标识，创建后不可改）</label><input id="f-cid" value="${esc(c.id || '')}" ${id ? 'disabled' : ''}></div>
    <div class="form-item"><label>分类名称 *</label><input id="f-cname" value="${esc(c.name || '')}"></div>
    <div class="form-item"><label>排序</label><input id="f-csort" type="number" value="${c.sort != null ? c.sort : 0}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCategory('${esc(id || '')}')">保存</button>
    </div>`);
}
async function saveCategory(id) {
  const body = {
    name: document.getElementById('f-cname').value.trim(),
    sort: document.getElementById('f-csort').value,
  };
  if (!body.name) return toast('请填写分类名称');
  if (id) await api('/api/admin/categories/' + id, 'PUT', body);
  else {
    body.id = document.getElementById('f-cid').value.trim();
    if (!body.id) return toast('请填写分类ID');
    await api('/api/admin/categories', 'POST', body);
  }
  closeModal(); toast('已保存'); loadCategories();
}

// ---------- 规格 ----------
let currentSpecs = null;
async function loadSpecs() {
  currentSpecs = await api('/api/admin/specs');
  document.getElementById('spec-cup').value = (currentSpecs.cup || []).map(x => x.name + ':' + x.extra).join(', ');
  document.getElementById('spec-sugar').value = (currentSpecs.sugar || []).join(', ');
  document.getElementById('spec-ice').value = (currentSpecs.ice || []).join(', ');
  document.getElementById('spec-toppings').value = (currentSpecs.toppings || []).map(x => x.name + ':' + x.extra).join(', ');
}
function parsePriced(str) {
  return str.split(/[,，]/).map(s => s.trim()).filter(Boolean).map(s => {
    const [name, extra] = s.split(/[:：]/);
    return { name: (name || '').trim(), extra: Number(extra || 0) };
  }).filter(x => x.name);
}
function parsePlain(str) {
  return str.split(/[,，]/).map(s => s.trim()).filter(Boolean);
}
async function saveSpecs() {
  const value = {
    cup: parsePriced(document.getElementById('spec-cup').value),
    sugar: parsePlain(document.getElementById('spec-sugar').value),
    ice: parsePlain(document.getElementById('spec-ice').value),
    toppings: parsePriced(document.getElementById('spec-toppings').value),
  };
  await api('/api/admin/specs', 'PUT', value);
  toast('规格已保存');
}

// ---------- 弹窗 ----------
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-mask').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-mask').classList.add('hidden');
}
document.getElementById('modal-mask').addEventListener('click', e => {
  if (e.target.id === 'modal-mask') closeModal();
});
document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

// ---------- Tab 切换 ----------
function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  ['orders', 'products', 'categories', 'specs'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
  });
}
